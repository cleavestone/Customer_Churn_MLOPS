<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row min-vh-100">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-dark text-white sidebar py-4">
                <div class="text-center mb-4">
                    <h2>🧠 AI Churn</h2>
                    <p class="small">Smart Predictions. Better Retention.</p>
                </div>
                <ul class="nav flex-column px-3">
                    <li class="nav-item"><a class="nav-link text-white" href="/">← Back to Form</a></li>
                </ul>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-5">
                <div class="text-center">
                    <h2 class="mb-4">Prediction Result</h2>

                    <div class="card shadow-lg p-4 mx-auto" style="max-width: 500px;">
                        <h4 class="text-muted">The model predicts:</h4>
                        {% if result == 'Churn' %}
                            <h1 class="text-danger fw-bold mt-3">Customer Will CHURN 😟</h1>
                        {% else %}
                            <h1 class="text-success fw-bold mt-3">Customer Will STAY 😊</h1>
                        {% endif %}
                        <p class="mt-4">Use this insight to make proactive decisions.</p>
                        <a href="/" class="btn btn-outline-primary mt-3">Predict Another</a>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
